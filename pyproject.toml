[project]
name = "embeddr-cli"
version = "0.2.0"
description = "Embeddr Local CLI Application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.128.0",
  "pillow>=12.1.0",
  "pydantic-settings>=2.12.0",
  "python-multipart>=0.0.21",
  "sqlmodel>=0.0.31",
  "transformers>=4.57.6",
  "typer>=0.21.1",
  "uvicorn[websockets]>=0.40.0",
  "embeddr-core>=0.1.5",
  "requests>=2.32.5",
  "qwen-vl-utils>=0.0.14",
  "boto3>=1.35.0",
  "httpx>=0.28.1",
  "einops>=0.8.1",
  "alembic>=1.18.1",
  "toml>=0.10.2",
  "textual>=7.3.0",
  "rich>=14.2.0",
  "questionary>=2.1.1",
  "websockets>=15.0.1",
  "numpy==2.3.5",

]

[project.urls]
Homepage = "https://github.com/embeddr-net/embeddr-cli"
Repository = "https://github.com/embeddr-net/embeddr-cli"
Issues = "https://github.com/embeddr-net/embeddr-cli/issues"


[project.optional-dependencies]
torch = ["torch>=2.9.1"]
dev = ["pytest>=9.0.2", "pytest-cov>=5.0.0", "pytest-asyncio>=0.25.0", "httpx>=0.28.1"]
postgres = ["psycopg2>=2.9.11"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = [
  "ignore::DeprecationWarning:pydantic",
  "ignore::DeprecationWarning:pydantic._internal",
  "ignore::DeprecationWarning:uvicorn",
  "ignore::DeprecationWarning:websockets",
]

[tool.coverage.run]
branch = true
source = ["embeddr"]
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true


[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
embeddr = ["web/**/*", "nelumbo/web/**/*", "db/alembic.ini", "db/alembic/**/*"]

[tool.uv.sources]
embeddr-core = { workspace = true }

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
embeddr = "embeddr.cli:main"
