[project]
dependencies = [
  "fastapi[standard]>=0.128.0",
  "numpy>=1.26.0",
  "pillow>=12.1.0",
  "pydantic-settings>=2.12.0",
  "python-multipart>=0.0.21",
  "sqlmodel>=0.0.31",
  "transformers>=4.57.3",
  "typer>=0.21.0",
  "uvicorn>=0.40.0",
  "embeddr-core>=0.1.5",
  "fastmcp>=2.14.1",
  "requests>=2.32.5",
  "qwen-vl-utils>=0.0.14",
  "httpx>=0.28.1",
  "einops>=0.8.1",
  "pyvips>=3.1.1",
  "pyvips-binary>=8.18.0",
  "alembic>=1.18.0",
  "toml>=0.10.2",
  "imagehash>=4.3.2",
  "textual>=7.2.0",
  "umap-learn==0.5.11",
  "numba==0.63.1",
]name = "embeddr-cli"
version = "0.1.5dev"
description = "Embeddr Local CLI Application"
readme = "README.md"
requires-python = ">=3.12"

[project.urls]
Homepage = "https://github.com/embeddr-net/embeddr-cli"
Repository = "https://github.com/embeddr-net/embeddr-cli"
Issues = "https://github.com/embeddr-net/embeddr-cli/issues"


[project.optional-dependencies]
torch = ["torch>=2.9.1"]
dev = ["pytest>=9.0.2", "httpx>=0.28.1"]


[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
embeddr = ["web/**/*", "db/alembic.ini", "db/alembic/**/*"]

[tool.uv.sources]
embeddr-core = { path = "../embeddr-core", editable = true }

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
embeddr = "embeddr.cli:main"
